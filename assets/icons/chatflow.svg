<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="ChatFlow">
<title>ChatFlow</title>
<defs>
<filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
  <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000" flood-opacity="0.38"/>
</filter>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
  <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
</filter>
<linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#5EEAD4"/><stop offset="0.6" stop-color="#14B8A6"/><stop offset="1" stop-color="#0B7C73"/>
</linearGradient>
<linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#BBF7D0"/><stop offset="0.3" stop-color="#4ADE80"/><stop offset="0.75" stop-color="#16A34A"/><stop offset="1" stop-color="#0E6B33"/>
</linearGradient>
<linearGradient id="frontEdge" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#0D5E2C"/><stop offset="1" stop-color="#063A1B"/>
</linearGradient>
<radialGradient id="dot" cx="0.38" cy="0.32" r="0.75">
  <stop offset="0" stop-color="#FFFFFF"/><stop offset="0.55" stop-color="#ECFDF5"/><stop offset="1" stop-color="#A7F3D0"/>
</radialGradient>
<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#DCFCE7" stop-opacity="0.95"/>
</linearGradient>
<linearGradient id="bgloss" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
</linearGradient>
<clipPath id="frontClip"><path d="''' + BUBBLE_FRONT + '''"/></clipPath>
</defs>
<g filter="url(#drop)" opacity="0.92">
  <path d="M150 92 H382 Q446 92 446 156 V262 Q446 326 382 326 H326 L362 386 L268 326 H150 Q86 326 86 262 V156 Q86 92 150 92 Z" fill="url(#back)"/>
  <path d="M150 104 H380 Q430 104 434 150" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
</g>
<g filter="url(#drop)">
  <path d="M134 170 H340 Q400 170 400 230 V330 Q400 390 340 390 H214 L140 448 L156 390 H134 Q74 390 74 330 V230 Q74 170 134 170 Z" fill="url(#frontEdge)" transform="translate(0 12)"/>
  <path d="M134 170 H340 Q400 170 400 230 V330 Q400 390 340 390 H214 L140 448 L156 390 H134 Q74 390 74 330 V230 Q74 170 134 170 Z" fill="url(#front)"/>
  <g clip-path="url(#frontClip)"><path d="M60 160 H420 V250 C300 236 180 248 60 270 Z" fill="url(#bgloss)"/></g>
</g>
<g filter="url(#soft)">
  <circle cx="152" cy="286" r="30" fill="#0A5A28" opacity="0.5" transform="translate(0 7)"/>
  <circle cx="152" cy="286" r="30" fill="url(#dot)"/>
  <ellipse cx="143" cy="274" rx="12" ry="8" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="237" cy="286" r="30" fill="#0A5A28" opacity="0.5" transform="translate(0 7)"/>
  <circle cx="237" cy="286" r="30" fill="url(#dot)"/>
  <ellipse cx="228" cy="274" rx="12" ry="8" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="322" cy="286" r="30" fill="#0A5A28" opacity="0.5" transform="translate(0 7)"/>
  <circle cx="322" cy="286" r="30" fill="url(#dot)"/>
  <ellipse cx="313" cy="274" rx="12" ry="8" fill="#FFFFFF" opacity="0.85"/>
</g>
</svg>
